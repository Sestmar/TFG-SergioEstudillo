<ion-header>
  <ion-toolbar color="primary">
    <ion-title *ngIf="currentUser$ | async as user">
      Bienvenido, {{ user.nombre }}
    </ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="onLogout()">
        <ion-icon slot="icon-only" name="log-out-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding" [fullscreen]="true">
  <div *ngIf="currentUser$ | async as user">
    <h1 class="ion-padding-start">Panel de Control</h1>
    
    <ion-grid>
      <ion-row>
        
        <ion-col size="12" size-md="4">
          <app-dashboard-card
            title="Mi Perfil"
            icon="person-circle-outline"
            description="Edita tu información personal."
            color="secondary"
            (cardClick)="goToProfile()">
          </app-dashboard-card>
        </ion-col>

        <ion-col size="12" size-md="4">
          <app-dashboard-card
            title="Mi Equipo"
            icon="shield-outline"
            description="Gestiona o visualiza tu equipo."
            color="primary"
            (cardClick)="goToMyTeam()">
          </app-dashboard-card>
        </ion-col>

        <ion-col size="12" size-md="4">
          <app-dashboard-card
            title="Mis Convocatorias"
            icon="calendar-outline"
            description="Próximos partidos y entrenamientos."
            color="tertiary"
            (cardClick)="goToConvocations()">
          </app-dashboard-card>
        </ion-col>
        
      </ion-row>
    </ion-grid>
  </div>

  <div *ngIf="!(currentUser$ | async)" class="ion-text-center ion-padding-top">
    <ion-spinner name="crescent" color="primary"></ion-spinner>
    <p>Cargando datos del usuario...</p>
  </div>
  
</ion-content>
