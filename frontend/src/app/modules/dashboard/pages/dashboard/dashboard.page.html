<ion-header>
  <ion-toolbar color="primary">
    <!-- El título se carga cuando el usuario (user) existe -->
    <ion-title *ngIf="currentUser$ | async as user">
      Bienvenido, {{ user.nombre }}
    </ion-title>
    <ion-buttons slot="end">
      <!-- El botón de Logout llama a la función onLogout() del TS -->
      <ion-button (click)="onLogout()">
        <ion-icon slot="icon-only" name="log-out-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding" [fullscreen]="true">
  <!-- Solo mostramos el contenido si el usuario está cargado -->
  <div *ngIf="currentUser$ | async as user">
    <h1 class="ion-padding-start">Panel de Control</h1>
    
    <ion-grid>
      <ion-row>
        
        <!-- Tarjeta 1: Mi Perfil -->
        <ion-col size="12" size-md="4">
          <!-- (cardClick) llama a la función goToProfile() del TS -->
          <app-dashboard-card
            title="Mi Perfil"
            icon="person-circle-outline"
            description="Edita tu información personal."
            color="secondary"
            (cardClick)="goToProfile()">
          </app-dashboard-card>
        </ion-col>

        <!-- Tarjeta 2: Equipos -->
        <ion-col size="12" size-md="4">
           <!-- (cardClick) llama a la función goToTeams() del TS -->
          <app-dashboard-card
            title="Equipos"
            icon="shield-outline"
            description="Ver todos los equipos del club."
            color="primary"
            (cardClick)="goToTeams()">
          </Vapp-dashboard-card>
        </ion-col>

        <!-- Tarjeta 3: Convocatorias -->
        <ion-col size="12" size-md="4">
           <!-- (cardClick) llama a la función goToConvocations() del TS -->
          <app-dashboard-card
            title="Mis Convocatorias"
            icon="calendar-outline"
            description="Próximos partidos y entrenamientos."
            color="tertiary"
            (cardClick)="goToConvocations()">
          </app-dashboard-card>
        </ion-col>
        
      </ion-row>
    </ion-grid>
  </div>

  <!-- Estado de Carga (mientras currentUser$ es null) -->
  <div *ngIf="!(currentUser$ | async)" class="ion-text-center ion-padding-top">
    <ion-spinner name="crescent" color="primary"></ion-spinner>
    <p>Cargando datos del usuario...</p>
  </div>
  
</ion-content>
