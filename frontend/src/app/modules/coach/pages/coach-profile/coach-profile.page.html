<ion-header class="ion-no-border">
  <ion-toolbar class="transparent-toolbar">
    <ion-buttons slot="start">
      <ion-button (click)="goBack()" color="light">
        <ion-icon name="arrow-back"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>MI PERFIL TÉCNICO</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="saveProfile()" class="save-btn-neon">
        <ion-icon name="checkmark" slot="start"></ion-icon>
        GUARDAR
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">

  <div class="main-container animate-fade-in">
    
    <div class="profile-header">
      <div class="avatar-wrapper" (click)="fileInput.click()">
        <div class="glow-ring">
            <img *ngIf="coachData.usuario.fotoUrl" [src]="coachData.usuario.fotoUrl" class="profile-img">
            <div *ngIf="!coachData.usuario.fotoUrl" class="initials-placeholder">
                {{ coachData.usuario.nombre?.charAt(0) || 'C' }}
            </div>
        </div>
        <div class="camera-btn">
          <ion-icon name="camera"></ion-icon>
        </div>
      </div>
      
      <input #fileInput type="file" accept="image/*" (change)="onFileSelected($event)" style="display: none;">

      <h2>{{ coachData.usuario.nombre }} {{ coachData.usuario.apellidos }}</h2>
      <p>{{ coachData.usuario.email }}</p>
    </div>

    <div class="section-title">
        <ion-icon name="id-card-outline"></ion-icon> DATOS PROFESIONALES
    </div>

    <div class="dark-card padding-lg">
        
        <div class="input-group">
            <label>TELÉFONO DE CONTACTO</label>
            <div class="input-wrapper">
                <input type="tel" [(ngModel)]="coachData.telefonoContacto" placeholder="+34 600 000 000" class="neon-input">
                <ion-icon name="call-outline"></ion-icon>
            </div>
        </div>

        <div class="input-group">
            <label>LICENCIA / TÍTULO</label>
            <div class="input-wrapper">
                <input type="text" [(ngModel)]="coachData.licencia" placeholder="Ej: UEFA Pro, Nivel 1..." class="neon-input">
                <ion-icon name="ribbon-outline"></ion-icon>
            </div>
        </div>

        <div class="input-group">
            <label>ESPECIALIDAD</label>
            <div class="input-wrapper">
                <input type="text" [(ngModel)]="coachData.especialidad" placeholder="Ej: Táctica, Porteros, Prep. Física" class="neon-input">
                <ion-icon name="football-outline"></ion-icon>
            </div>
        </div>

    </div>

    <div class="spacer"></div>

  </div>
</ion-content>
