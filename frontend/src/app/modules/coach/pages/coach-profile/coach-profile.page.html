<ion-header class="ion-no-border">
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-button (click)="goBack()">
        <ion-icon name="arrow-back-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>Mi Perfil Técnico</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="profile-bg">
  <div class="profile-container">
    
    <div class="profile-header">
      <div class="avatar-circle">
        {{ coachData.usuario.nombre?.charAt(0) || 'C' }}
      </div>
      <h2>{{ coachData.usuario.nombre }} {{ coachData.usuario.apellidos }}</h2>
      <p>{{ coachData.usuario.email }}</p>
    </div>

    <div class="form-card">
      
      <ion-item lines="none" class="custom-input">
        <ion-label position="stacked">Teléfono de Contacto</ion-label>
        <ion-input [(ngModel)]="coachData.telefonoContacto" placeholder="+34 600..."></ion-input>
        <ion-icon name="call-outline" slot="start"></ion-icon>
      </ion-item>

      <ion-item lines="none" class="custom-input">
        <ion-label position="stacked">Licencia / Título</ion-label>
        <ion-input [(ngModel)]="coachData.licencia" placeholder="Ej: UEFA Pro"></ion-input>
        <ion-icon name="ribbon-outline" slot="start"></ion-icon>
      </ion-item>

      <ion-item lines="none" class="custom-input">
        <ion-label position="stacked">Especialidad</ion-label>
        <ion-input [(ngModel)]="coachData.especialidad" placeholder="Ej: Táctica, Porteros..."></ion-input>
        <ion-icon name="football-outline" slot="start"></ion-icon>
      </ion-item>

      <ion-button expand="block" class="save-btn" (click)="saveProfile()">
        Guardar Cambios
      </ion-button>

    </div>
  </div>
</ion-content>
