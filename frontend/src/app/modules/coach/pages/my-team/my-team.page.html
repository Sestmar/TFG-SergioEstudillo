<ion-header class="ion-no-border">
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/coach-dashboard"></ion-back-button>
    </ion-buttons>
    <ion-title>Gestión de Plantilla</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="bg-light">
  
  <div class="ion-padding">
    
    <ion-list class="custom-list">
      <ion-item-sliding *ngFor="let p of players">
        
        <ion-item lines="none" class="player-item">
          <ion-avatar slot="start">
            <img [src]="getAvatar(p)">
          </ion-avatar>
          
          <ion-label>
            <h2>{{ p.usuario.nombre }} {{ p.usuario.apellidos }}</h2>
            <p>{{ p.posicion }} <span *ngIf="p.dorsal">#{{ p.dorsal }}</span></p>
          </ion-label>

          <ion-badge slot="end" [color]="p.estado === 'LESIONADO' ? 'danger' : 'success'">
            {{ p.estado }}
          </ion-badge>

          <ion-button slot="end" fill="clear" (click)="p.estado === 'LESIONADO' ? setRecovered(p) : openInjuryModal(p)">
            <ion-icon [name]="p.estado === 'LESIONADO' ? 'medkit' : 'bandage-outline'" [color]="p.estado === 'LESIONADO' ? 'success' : 'danger'"></ion-icon>
          </ion-button>
        </ion-item>

      </ion-item-sliding>
    </ion-list>
  </div>

  <ion-modal [isOpen]="isModalOpen" (didDismiss)="closeModal()">
    <ng-template>
      <ion-header>
        <ion-toolbar color="danger">
          <ion-title>Reportar Baja</ion-title>
          <ion-buttons slot="end">
            <ion-button (click)="closeModal()">Cerrar</ion-button>
          </ion-buttons>
        </ion-toolbar>
      </ion-header>

      <ion-content class="ion-padding">
        <div class="modal-content" *ngIf="selectedPlayer">
          
          <div class="player-summary">
            <h3>{{ selectedPlayer.usuario.nombre }}</h3>
            <p>Se marcará como NO DISPONIBLE</p>
          </div>

          <ion-list>
            <ion-item fill="outline" class="mb-3">
              <ion-label position="stacked">Tipo de Lesión / Causa</ion-label>
              <ion-input [(ngModel)]="injuryData.tipo" placeholder="Ej: Esguince tobillo, Gripe..."></ion-input>
            </ion-item>

            <ion-item fill="outline" class="mb-3">
              <ion-label position="stacked">Duración Estimada</ion-label>
              <ion-input [(ngModel)]="injuryData.duracion" placeholder="Ej: 2 semanas, Indefinido..."></ion-input>
            </ion-item>

            <ion-item fill="outline" class="mb-3">
              <ion-label position="stacked">Notas Adicionales</ion-label>
              <ion-textarea [(ngModel)]="injuryData.notas" rows="3" placeholder="Detalles médicos..."></ion-textarea>
            </ion-item>
          </ion-list>

          <ion-button expand="block" color="danger" (click)="saveInjury()" [disabled]="!injuryData.tipo">
            Confirmar Baja Médica
            <ion-icon name="alert-circle" slot="end"></ion-icon>
          </ion-button>

        </div>
      </ion-content>
    </ng-template>
  </ion-modal>

</ion-content>
