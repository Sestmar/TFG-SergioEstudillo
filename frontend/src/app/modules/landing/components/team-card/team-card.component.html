<!-- 
  Este HTML está arreglado para:
  1. Llamar a onCardClick() (que existe)
  2. Usar la VARIABLE 'teamBackgroundStyle' (que no causa bucle)
  3. Usar el @Input() 'showStats' (que existe)
-->
<ion-card 
  (click)="onCardClick()" 
  button="true" 
  class="team-card" 
  *ngIf="team">
  
  <!-- ¡AQUÍ ESTÁ EL ARREGLO! -->
  <!-- Ya no llama a una función, lee la variable 'teamBackgroundStyle' -->
  <div 
    class="team-card-background" 
    [style.background]="teamBackgroundStyle">
  </div>
  
  <ion-card-header>
    <ion-card-title>{{ team.nombre }}</ion-card-title>
    <ion-card-subtitle>{{ team.categoria }}</ion-card-subtitle>
  </ion-card-header>
  
  <ion-card-content *ngIf="showStats">
    <ion-item lines="none" class="stat-item">
      <ion-icon name="person-outline" slot="start" color="primary"></ion-icon>
      <ion-label>Entrenador: {{ team.entrenador || 'N/A' }}</ion-label>
    </ion-item>
  </ion-card-content>

</ion-card>
