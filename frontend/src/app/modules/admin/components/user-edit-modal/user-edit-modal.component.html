<ion-header class="ion-no-border">
  <ion-toolbar class="modal-toolbar">
    <ion-title>Editar Perfil</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="close()" class="close-btn">
        <ion-icon name="close-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="modal-content ion-padding">
  <form [formGroup]="editForm" (ngSubmit)="onSave()" class="stadium-form">
    
    <!-- SECCIÓN 1: IDENTIDAD -->
    <div class="form-section">
      <h3 class="section-title"><ion-icon name="person-circle-outline"></ion-icon> Identidad</h3>
      
      <div class="input-group">
        <label>Nombre</label>
        <input type="text" formControlName="nombre" placeholder="Ej: Sergio">
      </div>

      <div class="input-group">
        <label>Apellidos</label>
        <input type="text" formControlName="apellidos" placeholder="Ej: Estudillo">
      </div>

      <div class="input-group">
        <label>Email</label>
        <input type="email" formControlName="email" placeholder="correo@ejemplo.com">
      </div>

      <div class="input-group">
        <label>Teléfono</label>
        <input type="tel" formControlName="telefono" placeholder="+34 600 000 000">
      </div>
    </div>

    <!-- SECCIÓN 2: PERFIL DEPORTIVO (Solo si es Jugador) -->
    <div class="form-section" *ngIf="user.rol?.toUpperCase().includes('JUGADOR')">
      <h3 class="section-title"><ion-icon name="football-outline"></ion-icon> Perfil Deportivo</h3>
      
      <div class="row">
        <div class="input-group col">
          <label>Dorsal</label>
          <input type="number" formControlName="dorsal" placeholder="0-99">
        </div>
        <div class="input-group col">
          <label>Posición</label>
          <ion-select formControlName="posicion" interface="popover" [interfaceOptions]="{ cssClass: 'night-select-popover' }" class="modal-ion-select" placeholder="Seleccionar...">
            <ion-select-option value="PORTERO">Portero</ion-select-option>
            <ion-select-option value="DEFENSA">Defensa</ion-select-option>
            <ion-select-option value="CENTROCAMPISTA">Centrocampista</ion-select-option>
            <ion-select-option value="DELANTERO">Delantero</ion-select-option>
          </ion-select>
        </div>
      </div>

      <div class="input-group">
        <label>Equipo Principal</label>
        <ion-select formControlName="equipoId" interface="popover" [interfaceOptions]="{ cssClass: 'night-select-popover' }" class="modal-ion-select" placeholder="Sin equipo asignado">
          <ion-select-option [value]="null">Sin equipo asignado</ion-select-option>
          <ion-select-option *ngFor="let team of teams" [value]="team.idEquipo ?? team.id">{{ team.nombre }}</ion-select-option>
        </ion-select>
      </div>

      <div class="input-group">
        <label>Estado Físico</label>
        <ion-select formControlName="estado" interface="popover" [interfaceOptions]="{ cssClass: 'night-select-popover' }" class="modal-ion-select">
          <ion-select-option value="ACTIVO">Activo</ion-select-option>
          <ion-select-option value="LESIONADO">Lesionado</ion-select-option>
          <ion-select-option value="BAJA">Baja Temporal</ion-select-option>
        </ion-select>
      </div>
    </div>

    <!-- BOTONES DE ACCIÓN -->
    <div class="action-footer">
      <button type="button" class="btn-cancel" (click)="close()">Cancelar</button>
      <button type="submit" class="btn-save" [disabled]="editForm.invalid || isSaving">
        <ion-spinner name="crescent" *ngIf="isSaving"></ion-spinner>
        {{ isSaving ? 'Guardando...' : 'Guardar Cambios' }}
      </button>
    </div>

  </form>
</ion-content>
