<ion-header class="ion-no-border">
  <ion-toolbar class="transparent-toolbar">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/auth/login" color="light"></ion-back-button>
    </ion-buttons>
    <ion-title>CREAR CUENTA</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="auth-wrapper animate-fade-in">
    
    <div class="header-section">
      <div class="logo-wrapper">
        <img src="assets/img/mi-club-logo.png" alt="Logo Club">
      </div>
      <h2>Únete al Club</h2>
      <p>Completa tus datos para registrarte en la plataforma.</p>
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="onRegister()">
      
      <div class="file-upload-zone" (click)="fileInput.click()">
        <ion-icon name="camera-outline"></ion-icon>
        <span>Subir Foto de Perfil</span>
        <input #fileInput type="file" accept="image/*" (change)="onFileSelected($event)" style="display: none;">
      </div>

      <div class="input-group">
        <label>NOMBRE</label>
        <div class="input-container">
            <input type="text" formControlName="nombre" placeholder="Tu nombre" class="neon-input">
            <ion-icon name="person-outline"></ion-icon>
        </div>
        <div class="error-msg" *ngIf="nombre?.invalid && (nombre?.dirty || nombre?.touched)">
            El nombre es requerido.
        </div>
      </div>

      <div class="input-group">
        <label>APELLIDOS</label>
        <div class="input-container">
            <input type="text" formControlName="apellidos" placeholder="Tus apellidos" class="neon-input">
            <ion-icon name="people-outline"></ion-icon>
        </div>
        <div class="error-msg" *ngIf="apellidos?.invalid && (apellidos?.dirty || apellidos?.touched)">
            Los apellidos son requeridos.
        </div>
      </div>

      <div class="input-group">
        <label>CORREO ELECTRÓNICO</label>
        <div class="input-container">
            <input type="email" formControlName="email" placeholder="ejemplo@email.com" class="neon-input">
            <ion-icon name="mail-outline"></ion-icon>
        </div>
        <div class="error-msg" *ngIf="email?.invalid && (email?.dirty || email?.touched)">
            Introduce un email válido.
        </div>
      </div>

      <div class="input-group">
        <label>CONTRASEÑA</label>
        <div class="input-container">
            <input [type]="showPassword ? 'text' : 'password'" formControlName="password" placeholder="******" class="neon-input">
            <ion-icon [name]="showPassword ? 'eye-off-outline' : 'eye-outline'" (click)="showPassword = !showPassword" style="cursor: pointer; pointer-events: auto;"></ion-icon>
        </div>
        <div class="error-msg" *ngIf="password?.invalid && (password?.dirty || password?.touched)">
            Mínimo 6 caracteres.
        </div>
      </div>

      <div class="input-group">
        <label>CONFIRMAR CONTRASEÑA</label>
        <div class="input-container">
            <input type="password" formControlName="confirmPassword" placeholder="******" class="neon-input">
            <ion-icon name="shield-checkmark-outline"></ion-icon>
        </div>
        <div class="error-msg" *ngIf="registerForm.errors?.['passwordMismatch'] && (confirmPassword?.dirty || confirmPassword?.touched)">
            Las contraseñas no coinciden.
        </div>
      </div>

      <button type="submit" class="submit-btn" [disabled]="registerForm.invalid || isLoading">
        <span *ngIf="!isLoading">REGISTRARSE</span>
        <ion-spinner *ngIf="isLoading" name="dots"></ion-spinner>
      </button>

    </form>

    <div class="footer-link">
      <p>¿Ya tienes cuenta? <a routerLink="/auth/login">Inicia sesión</a></p>
    </div>

  </div>
</ion-content>
