<ion-content class="login-content">
  
  <div class="background-layer"></div>

  <div class="auth-wrapper animate-fade-in">
    
    <div class="glass-card">
      
      <div class="auth-header">
        <div class="logo-wrapper">
          <img src="assets/img/mi-club-logo.png" alt="Logo Club">
        </div>
        <h1>DAM United F.C</h1>
        <p>Acceso al Estadio</p>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onLogin()" class="auth-form">
        
        <div class="input-group">
            <label>CORREO ELECTRÓNICO</label>
            <div class="input-container">
                <input type="email" formControlName="email" placeholder="ejemplo@futchain.com" class="neon-input">
                <ion-icon name="mail-outline"></ion-icon>
            </div>
            <div class="error-msg" *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
                Introduce un email válido.
            </div>
        </div>

        <div class="input-group">
            <label>CONTRASEÑA</label>
            <div class="input-container">
                <input [type]="showPassword ? 'text' : 'password'" formControlName="password" placeholder="******" class="neon-input">
                <ion-icon [name]="showPassword ? 'eye-off-outline' : 'eye-outline'" (click)="togglePasswordVisibility()" class="eye-icon"></ion-icon>
            </div>
            <div class="error-msg" *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
                La contraseña es requerida.
            </div>
        </div>

        <div class="form-options">
          <label class="checkbox-container">
            <input type="checkbox" formControlName="rememberMe">
            <span class="checkmark"></span>
            Recordarme
          </label>
          <a class="forgot-link" routerLink="/auth/forgot-password">¿Olvidaste tu contraseña?</a>
        </div>

        <button type="submit" class="neon-button" [disabled]="loginForm.invalid || isLoading">
          <span *ngIf="!isLoading">INGRESAR</span>
          <ion-spinner name="dots" *ngIf="isLoading"></ion-spinner>
        </button>

      </form>

      <div class="auth-footer">
        <p>¿Nuevo fichaje?</p>
        <button class="register-btn" routerLink="/auth/register">
          Registrarse en el Club
        </button>
      </div>

    </div>
  </div>

</ion-content>
