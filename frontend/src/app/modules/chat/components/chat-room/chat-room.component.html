<div class="messages-container" #messagesContainer>
  <div *ngFor="let msg of mensajes"
       class="message-bubble"
       [class.own]="msg.remitenteId === currentUserId"
       [class.other]="msg.remitenteId !== currentUserId">

    <div class="avatar" *ngIf="msg.remitenteId !== currentUserId">
      <img *ngIf="msg.remitenteFotoUrl && !avatarErrorIds.has(msg.remitenteId)"
           [src]="msg.remitenteFotoUrl"
           alt=""
           (error)="onImgError($event, msg)">
      <div class="avatar-placeholder" *ngIf="!msg.remitenteFotoUrl || avatarErrorIds.has(msg.remitenteId)">
        {{ msg.remitenteNombre[0] }}{{ msg.remitenteApellidos[0] }}
      </div>
    </div>

    <div class="bubble-content">
      <span class="sender-name" *ngIf="msg.remitenteId !== currentUserId">
        {{ msg.remitenteNombre }} {{ msg.remitenteApellidos }}
      </span>
      <p class="bubble-text">{{ msg.contenido }}</p>
      <span class="bubble-time">{{ msg.fechaHora | date:'HH:mm' }}</span>
    </div>
  </div>

  <div class="empty-state" *ngIf="!mensajes || mensajes.length === 0">
    <ion-icon name="chatbubbles-outline"></ion-icon>
    <p>No hay mensajes aún. ¡Sé el primero en escribir!</p>
  </div>
</div>

<div class="input-area">
  <div class="input-wrapper">
    <input
      [(ngModel)]="contenido"
      placeholder="Escribe un mensaje..."
      class="message-input"
      (keyup.enter)="enviar()"
      maxlength="1000">
    <button class="send-btn" (click)="enviar()" [disabled]="!contenido?.trim()">
      <ion-icon name="send"></ion-icon>
    </button>
  </div>
</div>
