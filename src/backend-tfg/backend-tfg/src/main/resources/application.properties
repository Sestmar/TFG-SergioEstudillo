spring.application.name=BackendTFG

# --- CONFIGURACIÓN MYSQL (Mantenemos la original) ---
spring.datasource.url=jdbc:mysql://localhost:3306/club_futbol_tfg
spring.datasource.username=root
spring.datasource.password=admin

# --- JPA / HIBERNATE ---
# Usamos 'update' para que si añades algo nuevo se refleje, pero sin borrar datos
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

