# --- JWT CONFIGURATION ---
# Clave fija y segura (Base64)
application.security.jwt.secret-key=eW91clN0cm9uZ1NlY3JldEtleUZvclRGRzIwMjRCYXNlNjRFbmNvZGVkMjU2Qml0cw==
# Tiempo de expiracion: 86400000 ms = 24 horas
application.security.jwt.expiration=86400000

# --- HIKARI CP CONFIG (Para evitar desconexiones de Neon DB) ---
# Tiempo maximo de vida de una conexion (3 minutos). Neon suele cortar a los 5.
spring.datasource.hikari.max-lifetime=180000
# Tiempo para verificar si la conexion sigue viva
spring.datasource.hikari.connection-timeout=30000
# Minimo de conexiones en espera (para que vaya rapido al volver)
spring.datasource.hikari.minimum-idle=2

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB