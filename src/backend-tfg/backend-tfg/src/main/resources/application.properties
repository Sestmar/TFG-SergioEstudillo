spring.application.name=BackendTFG

# --- CONEXION DATABASE ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / HIBERNATE ---
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=Europe/Madrid

# --- SECURITY JWT ---
application.security.jwt.secret-key=${JWT_SECRET_KEY}
application.security.jwt.expiration=86400000

# --- HIKARI CP ---
spring.datasource.hikari.max-lifetime=180000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.minimum-idle=2

# --- FILE UPLOAD ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# --- GMAIL CONFIG (SSL MODE - PUERTO 465) ---
spring.mail.host=smtp.gmail.com
spring.mail.port=465
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.protocol=smtp

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Twilio WhatsApp
twilio.account.sid=${TWILIO_ACCOUNT_SID}
twilio.auth.token=${TWILIO_AUTH_TOKEN}
twilio.whatsapp.number=${TWILIO_WHATSAPP_NUMBER}

# Firebase FCM
# En local: colocar serviceAccountKey.json en src/main/resources/ (no commitear)
# En Render: crear Secret File en /etc/secrets/serviceAccountKey.json
#            y añadir env var FIREBASE_CONFIG_PATH=/etc/secrets/serviceAccountKey.json
firebase.config.path=${FIREBASE_CONFIG_PATH:classpath:serviceAccountKey.json}

# --- APP URLS ---
app.backend.url=${APP_BACKEND_URL:https://backend-tfg-sergio.onrender.com}
app.frontend.url=${APP_FRONTEND_URL:https://tfg-dam-united-web.onrender.com}